# One grouped PR per ecosystem per week for minor and patch updates; majors arrive as
# separate PRs. npm group bumps get the archive digest re-pinned by
# .github/workflows/dependabot-repin.yml when shipped bytes are unchanged.
version: 2

# Why this file exists: every `uses:` in this repo is SHA-pinned, and a SHA pin does not
# move on its own. Without Dependabot watching them, the pins silently rot — assay sat on
# astral-sh/setup-uv v8.3.2 while the rest of the portfolio moved to v9.0.0, purely
# because nothing was opening the bump PR.
#
# The version comment beside each pin must name the EXACT version (`# v9.0.0`), never a
# floating major (`# v9`). Dependabot rewrites the SHA and the comment together, and a
# floating-major comment turns into a lie the moment upstream re-points the tag.
#
# Every ecosystem is grouped (`patterns: ["*"]`) so each weekly run opens ONE PR per
# ecosystem instead of one PR per dependency. Python uses the `uv` ecosystem, not `pip`:
# `pip` widened pyproject ranges without relocking uv.lock, so its bumps were never
# installed or tested under the locked environment.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    labels:
      - dependencies
      - github-actions
  - package-ecosystem: npm
    directory: /ts
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    labels:
      - dependencies
      - npm
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      python:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    labels:
      - dependencies
      - python
