name: Dagger
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: assay-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  dagger:
    name: Dagger
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        env:
          # Engine from the GHCR mirror by digest (gainratio/ci docs/dagger-modules.md).
          _EXPERIMENTAL_DAGGER_RUNNER_HOST: image://ghcr.io/gainratio/mirror/registry.dagger.io/engine:v0.21.8@sha256:c9c1a0a6546380983d42e8d75adde070a2a0935c54b498d8bc9045d9cb2ee336
        with:
          version: "0.21.8"
          verb: call
          args: --repository="$GITHUB_REPOSITORY" ci --commit-sha=${{ github.sha }}
