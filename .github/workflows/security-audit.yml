name: Security audit
on:
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: assay-security
  cancel-in-progress: true
jobs:
  security:
    name: Dagger security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        env:
          # Engine from the GHCR mirror by digest (hseshadr/ci docs/dagger-modules.md).
          _EXPERIMENTAL_DAGGER_RUNNER_HOST: image://ghcr.io/hseshadr/mirror/registry.dagger.io/engine:v0.21.8@sha256:c9c1a0a6546380983d42e8d75adde070a2a0935c54b498d8bc9045d9cb2ee336
        with:
          version: "0.21.8"
          verb: call
          args: --repository="$GITHUB_REPOSITORY" security --commit-sha=${{ github.sha }}
