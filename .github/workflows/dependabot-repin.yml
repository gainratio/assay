# Re-pins the npm archive digest on Dependabot npm PRs when only devDependencies moved,
# and explains the manual step otherwise. Design and security reasoning:
# scripts/repin_npm_archive.py. The pin tests are unchanged. Every job is a base checkout
# then one Dagger call (hseshadr/ci fleet policy); event values reach Dagger only by env.
name: Dependabot re-pin
on:
  pull_request:
    branches: [main]
permissions: {}
concurrency:
  group: assay-repin-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  derive:
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.head_ref, 'dependabot/npm_and_yarn/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      decision: ${{ fromJSON(steps.classify.outputs.output).decision }}
      digest: ${{ fromJSON(steps.classify.outputs.output).digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: "${{ github.event.pull_request.base.sha }}", persist-credentials: false}
      - id: classify
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with: {version: "0.21.8", verb: call, args: --repository="$GITHUB_REPOSITORY" repin-classify --head-sha="$HEAD_SHA"}
  repin:
    needs: derive
    if: needs.derive.outputs.decision == 'auto'
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit the three re-pinned literals to the Dependabot branch
      actions: write # cancel the run on the superseded commit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: "${{ github.event.pull_request.base.sha }}", persist-credentials: false}
      - uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          DIGEST: ${{ needs.derive.outputs.digest }}
        with:
          version: "0.21.8"
          verb: call
          args: --repository="$GITHUB_REPOSITORY" repin-commit --github-token=env:GH_TOKEN --pr-number="$PR_NUMBER" --digest="$DIGEST"
  explain:
    needs: derive
    if: >-
      always() && github.event.action == 'opened' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (needs.derive.outputs.decision == 'review' || startsWith(github.head_ref, 'dependabot/github_actions/'))
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write # comment why this bump needs a human re-pin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: "${{ github.event.pull_request.base.sha }}", persist-credentials: false}
      - uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          KIND: ${{ needs.derive.outputs.decision == 'review' && 'archive' || 'actions' }}
        with:
          version: "0.21.8"
          verb: call
          args: --repository="$GITHUB_REPOSITORY" repin-explain --github-token=env:GH_TOKEN --pr-number="$PR_NUMBER" --kind="$KIND"
