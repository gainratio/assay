name: Publish trusted artifacts
on: # zizmor: ignore[dangerous-triggers] source-free bridge accepts only a successful manual default-branch candidate and its exact artifact
  workflow_run:
    workflows: [Dagger release candidate]
    types: [completed]
permissions: {}
concurrency:
  group: assay-publish
  cancel-in-progress: false
jobs:
  publish-python:
    name: Publish exact Python candidate
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'workflow_dispatch' &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      actions: read # Download only the triggering candidate artifact.
      contents: read # Lineage proof reads compare/ and branches/main.
      id-token: write # Mint the short-lived PyPI publishing identity.
    steps:
      # A dispatch on a TAG named `main` passes the `if` above. The central lineage proof
      # (hseshadr/ci#49) requires a successful release-candidate.yml run whose SHA is on main.
      - uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        with:
          version: "0.21.8"
          verb: call
          module: github.com/hseshadr/ci/modules/portfolio-foundation@a88866232e679b6353d2b75bceb01969be739f67
          args: release-lineage --github-token=env:GH_TOKEN --repository="$GITHUB_REPOSITORY" --run-id="$RUN_ID" --head-sha="$HEAD_SHA" --publish-run-id="$GITHUB_RUN_ID"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: assay-${{ github.event.workflow_run.head_sha }}
          path: candidate
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
      # Event values reach dagger-for-github's bash only as quoted variables.
      - id: plan
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        with:
          version: "0.21.8"
          verb: call
          module: github.com/hseshadr/assay@${{ github.event.workflow_run.head_sha }}
          args: pypi-required --candidate=candidate --expected-sha="$HEAD_SHA"
      - if: steps.plan.outputs.output == 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: candidate/release/python
          attestations: true
          print-hash: true
  publish-npm:
    name: Publish exact npm candidate
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'workflow_dispatch' &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      actions: read # Download only the triggering candidate artifact.
      contents: read # Lineage proof reads compare/ and branches/main.
      id-token: write # Pass typed OIDC request values to Dagger's npm publisher.
    steps:
      # A dispatch on a TAG named `main` passes the `if` above. The central lineage proof
      # (hseshadr/ci#49) requires a successful release-candidate.yml run whose SHA is on main.
      # release-provenance runs that same proof, then writes github-context.json: the GitHub
      # Actions context npm needs (to detect Actions, exchange OIDC, and sign provenance),
      # taken from this publish run's own record and kept outside the candidate.
      - uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        with:
          version: "0.21.8"
          verb: call
          module: github.com/hseshadr/ci/modules/portfolio-foundation@a88866232e679b6353d2b75bceb01969be739f67
          args: release-provenance --github-token=env:GH_TOKEN --repository="$GITHUB_REPOSITORY" --run-id="$RUN_ID" --head-sha="$HEAD_SHA" --publish-run-id="$GITHUB_RUN_ID" export --path=github-context.json
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: assay-${{ github.event.workflow_run.head_sha }}
          path: candidate
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
      - uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        with:
          version: "0.21.8"
          verb: call
          module: github.com/hseshadr/assay@${{ github.event.workflow_run.head_sha }}
          args: publish-npm --candidate=candidate --expected-sha="$HEAD_SHA" --oidc-url=env:ACTIONS_ID_TOKEN_REQUEST_URL --oidc-token=env:ACTIONS_ID_TOKEN_REQUEST_TOKEN --github-context=github-context.json
